apis:
- name: TAINA Tax Form API
  description: >-
    Gated REST API that lets financial institutions with their own KYC/onboarding
    process programmatically submit W-series forms, CRS self-certifications, and
    supporting documents for validation; receive validation results and codes with
    optional real-time webhook push to downstream systems; retrieve preview PDFs
    for electronic signature; and pull signed documents. Supports high-volume batch
    submission. No public OpenAPI specification or developer portal is published;
    access is provisioned to onboarded clients.
